<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Agenda — SharePoint Setup</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;padding:20px;max-width:700px;margin:0 auto;}
h1{font-size:18px;color:#1a5fa8;margin-bottom:16px;}
button{padding:8px 16px;background:#1a5fa8;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;margin:4px;}
button:hover{background:#1550a0;}
button.secondary{background:#fff;color:#333;border:1px solid #ccc;}
button.secondary:hover{background:#f5f5f5;}
.log{background:#f5f5f5;border:1px solid #ddd;border-radius:5px;padding:12px;margin-top:16px;font-family:monospace;font-size:11px;max-height:300px;overflow-y:auto;white-space:pre-wrap;}
.ok{color:#1e7e34;} .err{color:#c0392b;} .info{color:#666;}
input{width:100%;padding:6px 10px;border:1px solid #ccc;border-radius:5px;font-size:12px;margin-bottom:8px;box-sizing:border-box;}
label{font-size:11px;color:#666;display:block;margin-bottom:2px;}
.field-group{margin-bottom:12px;}
</style>
</head>
<body>
<h1>🛠 SharePoint Setup — Schoolagenda</h1>
<p style="color:#666;font-size:12px;margin-bottom:16px;">Dit script maakt de 6 SharePoint-lijsten aan voor de agenda-app. Voer dit éénmalig uit als beheerder.</p>

<div class="field-group"><label>Client ID</label><input id="clientId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
<div class="field-group"><label>Tenant ID</label><input id="tenantId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
<div class="field-group"><label>SharePoint Site URL</label><input id="siteUrl" placeholder="https://tenant.sharepoint.com/sites/naam"></div>

<button onclick="doSetup()">▶ Lijsten aanmaken</button>
<button class="secondary" onclick="doCheck()">🔍 Bestaande lijsten controleren</button>
<div class="log" id="log">Wacht op invoer…</div>

<script>
// MSAL 2.x exposeert zichzelf als window.msal (de namespace)
// PublicClientApplication zit op msal.PublicClientApplication
// Fallback: msalBrowser.PublicClientApplication (oudere CDN builds)
const MSAL_CLASS = (typeof msal !== 'undefined' && msal.PublicClientApplication)
  ? msal.PublicClientApplication
  : (typeof msalBrowser !== 'undefined' ? msalBrowser.PublicClientApplication : null);

let msalInstance, accessToken, siteId;

function log(msg, cls='info'){
  const el = document.getElementById('log');
  el.innerHTML += '<span class="' + cls + '">' + msg + '</span>\n';
  el.scrollTop = el.scrollHeight;
}

async function initMsal(){
  const clientId = document.getElementById('clientId').value.trim();
  const tenantId = document.getElementById('tenantId').value.trim();
  if(!clientId || !tenantId){ alert('Vul Client ID en Tenant ID in'); return false; }

  if(!MSAL_CLASS){
    log('❌ MSAL-bibliotheek niet geladen. Controleer je internetverbinding.', 'err');
    return false;
  }

  const msalConfig = {
    auth: {
      clientId: clientId,
      authority: 'https://login.microsoftonline.com/' + tenantId,
      redirectUri: window.location.href
    },
    cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false }
  };

  msalInstance = new MSAL_CLASS(msalConfig);
  await msalInstance.initialize();

  const resp = await msalInstance.handleRedirectPromise();
  let account = resp ? resp.account : null;
  if(!account){
    const accounts = msalInstance.getAllAccounts();
    account = accounts.length ? accounts[0] : null;
  }

  if(!account){
    log('→ Doorsturen naar Microsoft login…');
    await msalInstance.loginRedirect({ scopes: ['https://graph.microsoft.com/Sites.ReadWrite.All'] });
    return false;
  }

  log('✓ Aangemeld als: ' + (account.name || account.username), 'ok');

  const tokenReq = { scopes: ['https://graph.microsoft.com/Sites.ReadWrite.All'], account: account };
  try {
    accessToken = (await msalInstance.acquireTokenSilent(tokenReq)).accessToken;
  } catch(e) {
    await msalInstance.acquireTokenRedirect(tokenReq);
    return false;
  }
  return true;
}

async function getSiteId(){
  const siteUrl = document.getElementById('siteUrl').value.trim();
  if(!siteUrl){ log('❌ Vul de SharePoint Site URL in.', 'err'); return null; }
  const host = siteUrl.replace('https://','').split('/')[0];
  const path = '/' + siteUrl.replace('https://','').split('/').slice(1).join('/');
  const r = await fetch('https://graph.microsoft.com/v1.0/sites/' + host + ':' + path, {
    headers: { Authorization: 'Bearer ' + accessToken }
  });
  if(!r.ok){
    const e = await r.json();
    log('❌ Site niet gevonden: ' + (e.error && e.error.message || siteUrl), 'err');
    return null;
  }
  siteId = (await r.json()).id;
  log('✓ Site gevonden: ' + siteId, 'ok');
  return siteId;
}

async function createList(dk){
  const name = 'AgendaDK' + dk;
  log('→ Aanmaken: ' + name + '…');

  // Controleer eerst of de lijst al bestaat
  const checkR = await fetch(
    'https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists?$filter=displayName eq \'' + name + '\'',
    { headers: { Authorization: 'Bearer ' + accessToken } }
  );
  const checkD = await checkR.json();
  if(checkD.value && checkD.value[0]){
    log('  ⚠ ' + name + ' bestaat al — overgeslagen.', 'info');
    return;
  }

  // Maak lijst aan
  const r = await fetch('https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      displayName: name,
      list: { template: 'genericList' }
    })
  });

  if(!r.ok){
    const e = await r.json();
    log('  ❌ ' + name + ': ' + (e.error && e.error.message || 'onbekende fout'), 'err');
    return;
  }

  const listData = await r.json();
  const listId = listData.id;
  log('  ✓ ' + name + ' aangemaakt', 'ok');

  // Voeg kolommen toe (afzonderlijk — betrouwbaarder dan in één body)
  const columns = [
    { name: 'Klas',             text: {} },
    { name: 'DagData',          text: { allowMultipleLines: true, linesForEditing: 30, textType: 'plain' } },
    { name: 'WeekStart',        dateTime: { format: 'dateOnly' } },
    { name: 'LaatsteWijziging', dateTime: { format: 'dateTimeWithSeconds' } }
  ];

  for(const col of columns){
    const cr = await fetch(
      'https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists/' + listId + '/columns',
      { method: 'POST', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' }, body: JSON.stringify(col) }
    );
    if(cr.ok) log('    + kolom "' + col.name + '" aangemaakt', 'ok');
    else log('    ⚠ kolom "' + col.name + '" mislukt (niet fataal)', 'info');
  }
}

async function doSetup(){
  document.getElementById('log').innerHTML = '';
  log('Aanmelden…');
  if(!await initMsal()) return;
  if(!await getSiteId()) return;
  log('\nLijsten aanmaken (DK1–DK6)…');
  for(let dk = 1; dk <= 6; dk++) await createList(dk);
  log('\n✅ Setup voltooid! Je kan nu index.html configureren en deployen.', 'ok');
}

async function doCheck(){
  document.getElementById('log').innerHTML = '';
  log('Aanmelden…');
  if(!await initMsal()) return;
  if(!await getSiteId()) return;
  log('\nBestaande lijsten controleren…');
  for(let dk = 1; dk <= 6; dk++){
    const name = 'AgendaDK' + dk;
    const r = await fetch(
      'https://graph.microsoft.com/v1.0/sites/' + siteId + '/lists?$filter=displayName eq \'' + name + '\'',
      { headers: { Authorization: 'Bearer ' + accessToken } }
    );
    const d = await r.json();
    if(d.value && d.value[0]) log('  ✓ ' + name + ' bestaat (id: ' + d.value[0].id + ')', 'ok');
    else log('  — ' + name + ' niet gevonden', 'err');
  }
}
</script>
</body>
</html>
